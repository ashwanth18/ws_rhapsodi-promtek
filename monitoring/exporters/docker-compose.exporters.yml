# Host/container metrics exporters for edge devices (Pi / Jetson).
# Started by scripts/provision_device.sh and shipped in the slim deploy bundle.
services:
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    network_mode: host
    privileged: true
    restart: unless-stopped
    command:
      - --port=9190
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
