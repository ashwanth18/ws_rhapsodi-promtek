# Promtail on every edge / monitoring host.
# Discovers all Docker containers via the Docker socket and pushes to Loki.
#
# Labels:
#   host      — from /etc/hostname (matches Prometheus instance / device_id)
#   container — Docker container name (leading slash stripped)
#   stream    — stdout | stderr
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Drop the leading slash from /container_name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      # Prefer compose service name when present (cleaner than hashed names)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: compose_service
      - replacement: '${HOSTNAME}'
        target_label: host
      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/*-json.log
    pipeline_stages:
      - docker: {}
