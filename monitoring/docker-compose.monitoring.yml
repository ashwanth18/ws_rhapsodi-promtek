# Prometheus + Grafana + Alertmanager for the Rhapsodi fleet.
# Intended to run on the Jetson home server (or any always-on Tailscale node).
#
# Usage:
#   cd monitoring
#   # Edit prometheus/targets.json (or rely on file_sd from scripts/generate_prom_targets.sh)
#   docker compose -f docker-compose.monitoring.yml up -d
#
# UI (bind to Tailscale IP in production via firewall / bind address):
#   Grafana:      http://<jetson-tailscale-ip>:3001  (admin/admin — change on first login)
#   Prometheus:   http://<jetson-tailscale-ip>:9091
#   Alertmanager: http://<jetson-tailscale-ip>:9093

name: rhapsodi-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9091
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets-node.json:/etc/prometheus/targets-node.json:ro
      - ./prometheus/targets-cadvisor.json:/etc/prometheus/targets-cadvisor.json:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
