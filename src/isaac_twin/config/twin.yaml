# Isaac Sim side of the twin, read by isaac_twin/scene/build_cell.py.
# Not a ROS parameter file; the ROS nodes use twin_nodes.yaml.
layout_id: dual-container
# src/camera_robot_calibration/calibrations/<name>.calib (base_link -> camera_color_optical_frame)
calibration: niryo_d455_eob
physics_hz: 120
render_hz: 30

robot:
  # USD angular drives are per degree.
  stiffness: 1.0e5
  damping: 2.0e3
  max_force: 1.0e4
  # Position-driven arm with nothing dynamic to push against: gravity only
  # adds tracking error.
  gravity: false

camera:
  # D455 profiles used on the real cell (scoop_vision.launch.py: depth 848x480).
  depth: {width: 848, height: 480, fx: 428.0, rate_hz: 15}
  color: {width: 1280, height: 720, fx: 640.0, rate_hz: 15}

powder:
  cell_m: 0.005
  # Level bed this far above the RS6 floor after a reset.
  fill_depth_m: 0.04
  density_g_per_ml: 0.55
  color_rgb: [0.95, 0.93, 0.86]
  mesh_update_hz: 10

scoop:
  # Fraction of the carved powder that ends up in the bowl.
  capture_ratio: 1.0
  # Cohesive flour heaps above the bowl's level-fill capacity.
  heap_factor: 1.3
  # Flow over the lip at vibration intensity 1.0, only while the scoop is
  # tipped toward the lip (holds less than level) by min_pour_tilt_deg.
  # Vibration also knocks the heap off (heap_factor -> 1).
  vibration_flow_g_per_s: 4.0
  min_pour_tilt_deg: 10.0
  # Time constant for powder above capacity sliding off.
  spill_tau_s: 0.3
  capacity_hz: 5
