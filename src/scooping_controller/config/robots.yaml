robots:
  niryo:
    canonical_name: niryo_ned3pro
    aliases: [niryo, niryo_ned3pro]
    moveit_robot_name: niryo_ned3pro
    planning_group: arm
    eef_link: tcp_link
    base_frame: base_link
    flange_link: hand_link
    follow_joint_trajectory_controller: niryo_robot_follow_joint_trajectory_controller
    planning_pipeline: stomp
    position_only_goal: false
    targets:
      package: robot_moveit
      path: targets.yaml
    tool:
      mesh_resource: package://niryo_robot_description/meshes/ned3pro/stl/niryo_scoop_v4-ros.STL
      tcp_visual_offset_xyz: [0.15825, 0.0, -0.09356]
    # Canonical per-robot-type data-collection contract (data-collection-v2).
    # No cross-robot schema unification yet (per-robot-type is fine for
    # now) — this just declares topic names/types once so a future
    # unification pass only needs to write a mapping layer, not rediscover
    # topics per robot. Keep in sync with recording_profiles.yaml.
    telemetry:
      proprioception:
        joint_states: {topic: /joint_states, type: sensor_msgs/msg/JointState}
      actions:
        follow_joint_trajectory: {
          topic: /niryo_robot_follow_joint_trajectory_controller/follow_joint_trajectory,
          type: control_msgs/action/FollowJointTrajectory,
        }
      pour_phase:
        weight: {topic: /weight, type: std_msgs/msg/Float64}
        vibration_intensity: {topic: /vibration/intensity, type: std_msgs/msg/Float64}
        incline_control: {topic: /incline_control, type: std_msgs/msg/Float64}
        valve_control: {topic: /valve_control, type: std_msgs/msg/Float64}
        pour_status: {topic: /pour_status, type: std_msgs/msg/String}
      scoop_phase:
        # Populated once the depth+RGB camera pipeline lands (recording-profiles
        # todo); left declared-but-empty so the contract shape is stable.
        rgb: {topic: /camera/color/image_raw/compressed, type: sensor_msgs/msg/CompressedImage}
        depth: {topic: /camera/depth/image_rect_raw, type: sensor_msgs/msg/Image}
        camera_info: {topic: /camera/color/camera_info, type: sensor_msgs/msg/CameraInfo}
      health:
        events: {topic: /system/health_events, type: robot_common_msgs/msg/HealthEvent}
    sim:
      scene:
        package: scooping_controller
        path: config/container_scene/niryo_sim.yaml
      moveit_package: niryo_robot_moveit_interface
      urdf:
        package: niryo_robot_description
        path: urdf/ned3pro/niryo_ned3pro_gazebo.urdf.xacro
        xacro_args: []
      controllers:
        package: niryo_robot_moveit_interface
        path: config/ros2_controllers.yaml
      move_group_controller_params:
        package: scooping_controller
        path: config/move_group_controller_params.yaml
      spawn_model_name: niryo_ned3pro
      publish_world_to_base_tf: true
      planning_pipelines: [ompl, chomp, pilz_industrial_motion_planner, stomp]
    real:
      scene:
        package: scooping_controller
        path: config/container_scene/niryo_real.yaml
      moveit_package: niryo_ned3pro_moveit_config
      urdf:
        package: niryo_robot_description
        path: urdf/ned3pro/niryo_ned3pro.urdf.xacro
        xacro_args: []
      move_group_controller_params:
        package: scooping_controller
        path: config/move_group_controller_params.yaml
      driver:
        package: niryo_ned_ros2_driver
        path: launch/driver.launch.py
      timing:
        move_group_delay: 2.0
        move_to_delay: 4.0
        target_recorder_delay: 4.2
        task_frame_delay: 4.8
        marker_delay: 5.0
        container_delay: 5.5
        collisions_delay: 5.7
        mtc_delay: 6.0
        rviz_delay: 7.0
    # Laptop-only authoring loop: mock_components/GenericSystem, no Gazebo,
    # no real driver. Isolated via ROS_DOMAIN_ID=42 (see scripts/dev_bench.sh).
    mock:
      scene:
        package: scooping_controller
        path: config/container_scene/niryo_real.yaml
      moveit_package: niryo_ned3pro_moveit_config
      urdf:
        package: niryo_ned3pro_moveit_config
        path: config/niryo_ned3pro.urdf.xacro
        xacro_args: []
      controllers:
        package: scooping_controller
        path: config/ros2_controllers_mock.yaml
      move_group_controller_params:
        package: scooping_controller
        path: config/move_group_controller_params.yaml
      timing:
        move_group_delay: 1.0
        # Wait for move_group to publish robot_description_semantic.
        move_to_delay: 4.0
        target_recorder_delay: 4.2
        task_frame_delay: 1.5
        marker_delay: 1.5
        container_delay: 1.7
        collisions_delay: 1.8
        mtc_delay: 4.5
        rviz_delay: 2.5

  jaka:
    canonical_name: jaka_zu5
    aliases: [jaka, jaka_zu5]
    moveit_robot_name: jaka_zu5
    planning_group: jaka_zu5
    eef_link: tcp_link
    base_frame: link0
    flange_link: Link6
    follow_joint_trajectory_controller: jaka_zu5_controller
    planning_pipeline: ompl
    position_only_goal: false
    targets:
      package: robot_moveit
      path: targets/jaka_zu5.yaml
    # Fixed Frame link0 + Lexium Safety panel (Bring Up / Shut Down / STOP).
    rviz:
      package: scooping_controller
      path: config/scooping_jaka.rviz
    tool:
      mesh_resource: package://niryo_robot_description/meshes/stl/niryo_scoop_v4-ros.STL
      tcp_visual_offset_xyz: [0.15825, 0.0, -0.09356]
    # See the niryo entry above for what this block is for.
    telemetry:
      proprioception:
        joint_states: {topic: /joint_states, type: sensor_msgs/msg/JointState}
      actions:
        follow_joint_trajectory: {
          topic: /jaka_zu5_controller/follow_joint_trajectory,
          type: control_msgs/action/FollowJointTrajectory,
        }
      pour_phase:
        weight: {topic: /weight, type: std_msgs/msg/Float64}
        vibration_intensity: {topic: /vibration/intensity, type: std_msgs/msg/Float64}
        incline_control: {topic: /incline_control, type: std_msgs/msg/Float64}
        valve_control: {topic: /valve_control, type: std_msgs/msg/Float64}
        pour_status: {topic: /pour_status, type: std_msgs/msg/String}
      scoop_phase:
        rgb: {topic: /camera/color/image_raw/compressed, type: sensor_msgs/msg/CompressedImage}
        depth: {topic: /camera/depth/image_rect_raw, type: sensor_msgs/msg/Image}
        camera_info: {topic: /camera/color/camera_info, type: sensor_msgs/msg/CameraInfo}
      health:
        events: {topic: /system/health_events, type: robot_common_msgs/msg/HealthEvent}
    sim:
      scene:
        package: scooping_controller
        path: config/container_scene/jaka_sim.yaml
      moveit_package: jaka_zu5_moveit_config
      urdf:
        package: jaka_zu5_moveit_config
        path: config/jaka_zu5.urdf.xacro
        xacro_args: ["use_gazebo:=true"]
      controllers:
        package: jaka_zu5_moveit_config
        path: config/ros2_controllers.yaml
      spawn_model_name: jaka_zu5
      publish_world_to_base_tf: false
      planning_pipelines: [ompl]
    real:
      scene:
        package: scooping_controller
        path: config/container_scene/jaka_real.yaml
      moveit_package: jaka_zu5_moveit_config
      urdf:
        package: jaka_zu5_moveit_config
        path: config/jaka_zu5.urdf.xacro
        # use_rviz_sim keeps ros2_control on mock_components; scooping_real does
        # not run controller_manager. Trajectory execution goes through
        # lexium_driver (FollowJointTrajectory + /joint_states via JSON/TCP).
        xacro_args: ["use_rviz_sim:=true"]
      controllers:
        package: jaka_zu5_moveit_config
        path: config/ros2_controllers.yaml
      move_group_controller_params:
        package: scooping_controller
        path: config/move_group_controller_params_jaka.yaml
      # Lexium JSON/TCP driver (Schneider Lexium Cobot; kinematic twin of
      # JAKA Zu5). JAKA SDK packages cannot log into Lexium firmware.
      # ${ROBOT_IP} is expanded by scooping_real.launch.py from the robot_ip
      # launch arg / ROBOT_IP env (default Lexium: 192.168.88.82).
      # Power/enable is operator-driven (RViz Lexium Safety panel or
      # /lexium_driver/bring_up); the driver itself connects immediately.
      driver:
        package: lexium_driver
        path: launch/lexium_driver.launch.py
        launch_arguments:
          ip: ${ROBOT_IP}
      timing:
        move_group_delay: 8.0
        move_to_delay: 9.0
        target_recorder_delay: 9.2
        task_frame_delay: 9.5
        marker_delay: 9.7
        container_delay: 10.0
        collisions_delay: 10.2
        mtc_delay: 10.5
        rviz_delay: 11.0
    # Laptop-only authoring loop (mock_components via use_rviz_sim:=true).
    mock:
      scene:
        package: scooping_controller
        path: config/container_scene/jaka_real.yaml
      moveit_package: jaka_zu5_moveit_config
      urdf:
        package: jaka_zu5_moveit_config
        path: config/jaka_zu5.urdf.xacro
        xacro_args: ["use_rviz_sim:=true", "use_gazebo:=false"]
      controllers:
        package: scooping_controller
        path: config/ros2_controllers_mock_jaka.yaml
      move_group_controller_params:
        package: scooping_controller
        path: config/move_group_controller_params_jaka.yaml
      timing:
        move_group_delay: 1.0
        move_to_delay: 2.0
        target_recorder_delay: 2.2
        task_frame_delay: 1.5
        marker_delay: 1.5
        container_delay: 1.7
        collisions_delay: 1.8
        mtc_delay: 2.0
        rviz_delay: 2.5
