---
# First-time (or re-)provision of a Rhapsodi robot device over Tailscale.
#
# Parameterized by robot type so Fleet Console "Flash install" can pick
# niryo vs jaka. Idempotent where practical.
#
# Prerequisites on the controller:
#   echo 'your-vault-password' > ansible/.vault_pass && chmod 600 ansible/.vault_pass
#   Device already on the Tailnet with tag:robot (or hostname heuristic).
#
# Examples:
#   ansible-playbook -i ansible/inventory/tailscale.py ansible/provision.yml \
#     --limit rhapsodi-pi5 \
#     -e robot_type=niryo -e site_id=site-1 -e image_tag=abc1234
#
# Manual fallback before Tailscale is joined: scripts/provision_device.sh

- name: Provision Rhapsodi robot device
  hosts: robots
  serial: 1
  gather_facts: true
  become: true
  become_flags: "-n"
  vars:
    workspace_dir: "{{ lookup('env', 'WORKSPACE_DIR') | default('/opt/rhapsodi/ws_rhapsodi-promtek', true) }}"
    env_file: "{{ workspace_dir }}/robot-prod.env"
    compose_file: "{{ workspace_dir }}/docker-compose.robot-prod.yml"
    exporters_compose: "{{ workspace_dir }}/monitoring/exporters/docker-compose.exporters.yml"
    image_registry: "{{ lookup('env', 'IMAGE_REGISTRY') | default('iserenity/rhapsodi-promtek', true) }}"
    git_repo: "{{ lookup('env', 'GIT_REPO') | default('git@github.com:ashwanth18/ws_rhapsodi-promtek.git', true) }}"
    deploy_branch: "{{ lookup('env', 'DEPLOY_BRANCH') | default('deploy', true) }}"
    deploy_tag: "deploy-{{ image_tag }}"
    health_url: "http://127.0.0.1:8000/health"
    health_retries: 36
    health_delay: 5
    install_user: "{{ ansible_user }}"
    device_id: "{{ inventory_hostname }}"
    robot_id: "{{ inventory_hostname }}"
    site_id: "site-1"
    processing_url: "http://localhost:8002/process"
    ingestion_url: "http://localhost:8011/ingest"
  tasks:
    - name: Require image_tag and robot_type
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | length > 0
          - robot_type is defined
          - robot_type in ['niryo', 'jaka']
        fail_msg: >-
          Pass -e image_tag=<git-short-sha> -e robot_type=niryo|jaka
          (optional: -e site_id=... -e device_id=...).

    - name: Require vaulted Docker Hub credentials
      ansible.builtin.assert:
        that:
          - dockerhub_username is defined
          - dockerhub_token is defined
          - postgres_password is defined
        fail_msg: >-
          Missing vault secrets. Create ansible/.vault_pass and ensure
          group_vars/all/vault.yml decrypts (see vault.yml.example).

    - name: Guard against Jaka on arm64 (vendor libjakaAPI.so is x86-only)
      ansible.builtin.fail:
        msg: >-
          robot_type=jaka is not supported on {{ ansible_architecture }} yet.
          The Jaka vendor library (libjakaAPI.so) is x86_64-only; ARM64 ROS
          images skip jaka_driver/jaka_planner. Use robot_type=niryo on Pi /
          Jetson, or provision Jaka on an amd64 host.
      when:
        - robot_type == 'jaka'
        - ansible_architecture in ['aarch64', 'arm64']

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - jq
          - gnupg
          - lsb-release
          - openssh-server
          - python3
          - python3-venv
        state: present
        update_cache: true

    - name: Check whether Docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Detect dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Install Docker Engine (official apt repo)
      when: docker_check.rc != 0
      block:
        - name: Ensure keyrings directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add Docker GPG key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add Docker apt repository
          ansible.builtin.apt_repository:
            repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            filename: docker
            state: present

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

    - name: Ensure install user is in docker group
      ansible.builtin.user:
        name: "{{ install_user }}"
        groups: docker
        append: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure workspace parent exists
      ansible.builtin.file:
        path: "{{ workspace_dir | dirname }}"
        state: directory
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0755"

    - name: Check for existing slim deploy checkout
      ansible.builtin.stat:
        path: "{{ workspace_dir }}/.git"
      register: workspace_git

    - name: Clone slim deploy bundle (first provision)
      when: not workspace_git.stat.exists
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p "{{ workspace_dir }}"
        if git clone --depth 1 --branch "{{ deploy_tag }}" "{{ git_repo }}" "{{ workspace_dir }}"; then
          exit 0
        fi
        # Tag refs sometimes need an explicit fetch path.
        git -C "{{ workspace_dir }}" init
        git -C "{{ workspace_dir }}" remote add origin "{{ git_repo }}" || \
          git -C "{{ workspace_dir }}" remote set-url origin "{{ git_repo }}"
        git -C "{{ workspace_dir }}" fetch --depth 1 origin "refs/tags/{{ deploy_tag }}:refs/tags/{{ deploy_tag }}" \
          || git -C "{{ workspace_dir }}" fetch --depth 1 origin "{{ deploy_tag }}" \
          || git -C "{{ workspace_dir }}" fetch --depth 1 origin "{{ deploy_branch }}"
        git -C "{{ workspace_dir }}" checkout --force FETCH_HEAD
      args:
        executable: /bin/bash

    - name: Checkout deploy tag on existing workspace
      when: workspace_git.stat.exists
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ workspace_dir }}"
        git remote set-url origin "{{ git_repo }}" || true
        if git fetch --depth 1 origin "refs/tags/{{ deploy_tag }}:refs/tags/{{ deploy_tag }}"; then
          :
        elif git fetch --depth 1 origin "tag" "{{ deploy_tag }}"; then
          :
        else
          git fetch --depth 1 origin "{{ deploy_tag }}" \
            || git fetch --depth 1 origin "{{ deploy_branch }}"
        fi
        git checkout --force "{{ deploy_tag }}" || git checkout --force FETCH_HEAD
      args:
        executable: /bin/bash

    - name: Ensure config directory exists
      ansible.builtin.file:
        path: "{{ workspace_dir }}/config"
        state: directory
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0755"

    - name: Template config/device.yaml from robot_type / site_id
      ansible.builtin.template:
        src: templates/device.yaml.j2
        dest: "{{ workspace_dir }}/config/device.yaml"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"
        force: true

    - name: Ensure robot-prod.env exists from example
      ansible.builtin.copy:
        src: "{{ workspace_dir }}/robot-prod.env.example"
        dest: "{{ env_file }}"
        remote_src: true
        force: false
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"

    - name: Ensure per-device env is writable by deploy user
      ansible.builtin.file:
        path: "{{ env_file }}"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"

    - name: Pin IMAGE_TAG, image refs, and Postgres password in robot-prod.env
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        ENV="{{ env_file }}"
        TAG="{{ image_tag }}"
        REG="{{ image_registry }}"
        PG="{{ postgres_password }}"
        touch "$ENV"
        ensure_key() {
          local key="$1"
          grep -q "^${key}=" "$ENV" || echo "${key}=" >> "$ENV"
        }
        ensure_key IMAGE_TAG
        ensure_key ROS_PROD_IMAGE
        ensure_key BACKEND_IMAGE
        ensure_key PROCESSING_IMAGE
        ensure_key WEBHOOK_IMAGE
        ensure_key DASHBOARD_IMAGE
        ensure_key CONDOR_AGENT_IMAGE
        ensure_key POSTGRES_PASSWORD
        sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${TAG}|" "$ENV"
        sed -i "s|^ROS_PROD_IMAGE=.*|ROS_PROD_IMAGE=${REG}:ros-prod-${TAG}|" "$ENV"
        sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${REG}:backend-${TAG}|" "$ENV"
        sed -i "s|^PROCESSING_IMAGE=.*|PROCESSING_IMAGE=${REG}:processing-${TAG}|" "$ENV"
        sed -i "s|^WEBHOOK_IMAGE=.*|WEBHOOK_IMAGE=${REG}:webhook-${TAG}|" "$ENV"
        sed -i "s|^DASHBOARD_IMAGE=.*|DASHBOARD_IMAGE=${REG}:dashboard-${TAG}|" "$ENV"
        sed -i "s|^CONDOR_AGENT_IMAGE=.*|CONDOR_AGENT_IMAGE=${REG}:condor-agent-${TAG}|" "$ENV"
        sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${PG}|" "$ENV"
      args:
        executable: /bin/bash
      no_log: true

    - name: Write .rhapsodi-version for /host_info polling
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/.rhapsodi-version"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"
        content: |
          {"image_tag": "{{ image_tag }}", "deployed_at": "{{ ansible_date_time.iso8601 }}", "robot_type": "{{ robot_type }}", "site_id": "{{ site_id }}"}

    - name: Docker Hub login for private image pulls
      # Run as root so freshly-added docker group membership is not required.
      ansible.builtin.shell: |
        set -euo pipefail
        echo "{{ dockerhub_token }}" | docker login -u "{{ dockerhub_username }}" --password-stdin
      args:
        executable: /bin/bash
      no_log: true

    - name: Ensure exporters compose is present
      ansible.builtin.stat:
        path: "{{ exporters_compose }}"
      register: exporters_stat

    - name: Fail if exporters compose missing from deploy bundle
      ansible.builtin.fail:
        msg: >-
          Missing {{ exporters_compose }}. Publish the slim deploy bundle
          (scripts/publish_deploy_bundle.sh) for image_tag={{ image_tag }}.
      when: not exporters_stat.stat.exists

    - name: Start exporters (node_exporter + cadvisor)
      ansible.builtin.command:
        cmd: docker compose -f {{ exporters_compose }} up -d
        chdir: "{{ workspace_dir }}"

    - name: Pull robot stack images
      ansible.builtin.command:
        cmd: docker compose --env-file {{ env_file }} -f {{ compose_file }} pull
        chdir: "{{ workspace_dir }}"

    - name: Start robot stack
      ansible.builtin.command:
        cmd: docker compose --env-file {{ env_file }} -f {{ compose_file }} up -d --remove-orphans
        chdir: "{{ workspace_dir }}"

    - name: Wait for backend health
      ansible.builtin.uri:
        url: "{{ health_url }}"
        method: GET
        status_code: [200, 204]
      register: health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: health is succeeded

    - name: Provision summary
      ansible.builtin.debug:
        msg: >-
          Provisioned {{ inventory_hostname }} as robot_type={{ robot_type }}
          site_id={{ site_id }} image_tag={{ image_tag }}
          workspace={{ workspace_dir }}
