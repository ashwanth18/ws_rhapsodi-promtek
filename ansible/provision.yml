---
# First-time (or re-)provision of a Rhapsodi robot device over Tailscale.
#
# Installs Docker, clones the slim deploy bundle, templates device identity,
# and installs fleet-agent. Routine version/profile changes are pull-based:
# Fleet Console sets desired release_id + profile_id; fleet-agent converges.
#
# Prerequisites on the controller:
#   echo 'your-vault-password' > ansible/.vault_pass && chmod 600 ansible/.vault_pass
#   Device already on the Tailnet with tag:robot (or hostname heuristic).
#
# Examples:
#   ansible-playbook -i ansible/inventory/tailscale.py ansible/provision.yml \
#     --limit rhapsodi-pi5 \
#     -e robot_type=niryo -e site_id=site-1 -e image_tag=abc1234 \
#     -e agent_token=... -e fleet_console_url=http://jetson:8090

- name: Provision Rhapsodi robot device
  hosts: robots
  serial: 1
  gather_facts: true
  become: true
  become_flags: "-n"
  vars:
    workspace_dir: "{{ lookup('env', 'WORKSPACE_DIR') | default('/opt/rhapsodi/ws_rhapsodi-promtek', true) }}"
    env_file: "{{ workspace_dir }}/robot-prod.env"
    image_registry: "{{ lookup('env', 'IMAGE_REGISTRY') | default('iserenity/rhapsodi-promtek', true) }}"
    git_repo: "{{ lookup('env', 'GIT_REPO') | default('git@github.com:ashwanth18/ws_rhapsodi-promtek.git', true) }}"
    deploy_branch: "{{ lookup('env', 'DEPLOY_BRANCH') | default('deploy', true) }}"
    deploy_tag: "deploy-{{ image_tag }}"
    health_url: "http://127.0.0.1:8000/health"
    health_retries: 36
    health_delay: 5
    install_user: "{{ ansible_user }}"
    device_id: "{{ inventory_hostname }}"
    robot_id: "{{ inventory_hostname }}"
    site_id: "site-1"
    processing_url: "http://localhost:8002/process"
    ingestion_url: "http://localhost:8011/ingest"
    fleet_agent_dir: /opt/rhapsodi/fleet-agent
    fleet_console_url: "{{ lookup('env', 'FLEET_CONSOLE_URL') | default('http://127.0.0.1:8090', true) }}"
    agent_token: ""
    agent_poll_interval: 30
    # Controller-side path to fleet_agent sources (monorepo on Jetson / laptop).
    fleet_agent_src: "{{ lookup('env', 'REPO_ROOT') | default(playbook_dir + '/..', true) }}/src/fleet_agent"
  tasks:
    - name: Require image_tag and robot_type
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | length > 0
          - robot_type is defined
          - robot_type | length > 0
          - agent_token is defined
          - agent_token | length > 0
        fail_msg: >-
          Pass -e image_tag=<git-short-sha> -e robot_type=<from profiles.yaml>
          -e agent_token=<minted> (optional: -e site_id=... -e fleet_console_url=...).

    - name: Require vaulted Docker Hub credentials
      ansible.builtin.assert:
        that:
          - dockerhub_username is defined
          - dockerhub_token is defined
          - postgres_password is defined
        fail_msg: >-
          Missing vault secrets. Create ansible/.vault_pass and ensure
          group_vars/all/vault.yml decrypts (see vault.yml.example).

    # Historical note: jaka_driver/jaka_planner (vendor libjakaAPI.so) were
    # x86_64-only and used to block robot_type=jaka on arm64. Real Jaka/Lexium
    # cells now use lexium_driver (pure Python JSON/TCP, arch-independent);
    # the SDK packages are skipped unconditionally in docker/ros/Dockerfile.prod.
    # No architecture guard remains for robot_type=jaka.

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - jq
          - gnupg
          - lsb-release
          - openssh-server
          - python3
          - python3-venv
        state: present
        update_cache: true

    - name: Check whether Docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Detect dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Install Docker Engine (official apt repo)
      when: docker_check.rc != 0
      block:
        - name: Ensure keyrings directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add Docker GPG key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add Docker apt repository
          ansible.builtin.apt_repository:
            repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            filename: docker
            state: present

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

    - name: Ensure install user is in docker group
      ansible.builtin.user:
        name: "{{ install_user }}"
        groups: docker
        append: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # Pi ↔ Niryo link-local NAT + chrony (host OS; not in Docker).
    - name: Configure Pi Niryo link networking and chrony
      ansible.builtin.include_tasks: tasks/pi_niryo_link.yml
      when: robot_type | default('') == 'niryo'

    - name: Ensure workspace parent exists
      ansible.builtin.file:
        path: "{{ workspace_dir | dirname }}"
        state: directory
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0755"

    - name: Check for existing slim deploy checkout
      ansible.builtin.stat:
        path: "{{ workspace_dir }}/.git"
      register: workspace_git

    # Prefer HTTPS for tag fetches — edge devices often lack a GitHub deploy
    # key, and git@github.com SSH hangs on "Permission denied (publickey)".
    - name: Resolve HTTPS git URL for deploy-bundle fetch
      ansible.builtin.set_fact:
        git_repo_https: "{{ git_repo | regex_replace('^git@github\\.com:', 'https://github.com/') }}"

    - name: Clone slim deploy bundle (first provision)
      when: not workspace_git.stat.exists
      become: true
      become_user: "{{ install_user }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p "{{ workspace_dir }}"
        # Try HTTPS first (no SSH key required for public/readable repos / tags).
        if git clone --depth 1 --branch "{{ deploy_tag }}" "{{ git_repo_https }}" "{{ workspace_dir }}"; then
          exit 0
        fi
        if git clone --depth 1 --branch "{{ deploy_tag }}" "{{ git_repo }}" "{{ workspace_dir }}"; then
          exit 0
        fi
        git -C "{{ workspace_dir }}" init
        git -C "{{ workspace_dir }}" remote add origin "{{ git_repo_https }}" || \
          git -C "{{ workspace_dir }}" remote set-url origin "{{ git_repo_https }}"
        timeout 60 git -C "{{ workspace_dir }}" fetch --depth 1 origin "refs/tags/{{ deploy_tag }}:refs/tags/{{ deploy_tag }}" \
          || timeout 60 git -C "{{ workspace_dir }}" fetch --depth 1 origin "{{ deploy_tag }}" \
          || timeout 60 git -C "{{ workspace_dir }}" fetch --depth 1 origin "{{ deploy_branch }}"
        git -C "{{ workspace_dir }}" checkout --force FETCH_HEAD
      args:
        executable: /bin/bash

    # Split so the console log advances (a single shell task stays silent
    # until the whole script finishes — looks "stuck" on the TASK line).
    - name: Check whether deploy tag already exists locally
      when: workspace_git.stat.exists
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.command:
        cmd: git rev-parse -q --verify "refs/tags/{{ deploy_tag }}"
        chdir: "{{ workspace_dir }}"
      register: local_deploy_tag
      changed_when: false
      failed_when: false

    - name: Point origin at HTTPS (avoids SSH publickey hang)
      when:
        - workspace_git.stat.exists
        - local_deploy_tag.rc != 0
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ workspace_dir }}"
        git remote set-url origin "{{ git_repo_https }}" 2>/dev/null \
          || git remote add origin "{{ git_repo_https }}"
        echo "origin -> $(git config --get remote.origin.url)"
      args:
        executable: /bin/bash

    - name: Fetch deploy tag over HTTPS (60s timeout)
      when:
        - workspace_git.stat.exists
        - local_deploy_tag.rc != 0
      become: true
      become_user: "{{ install_user }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ workspace_dir }}"
        echo "Fetching {{ deploy_tag }} from origin (HTTPS, 60s cap)…"
        if timeout 60 git fetch --depth 1 origin "refs/tags/{{ deploy_tag }}:refs/tags/{{ deploy_tag }}"; then
          echo "Fetched refs/tags/{{ deploy_tag }}"
          exit 0
        fi
        echo "Tag ref fetch failed; trying loose {{ deploy_tag }}…"
        if timeout 60 git fetch --depth 1 origin "{{ deploy_tag }}"; then
          echo "Fetched {{ deploy_tag }}"
          exit 0
        fi
        echo "ERROR: could not fetch {{ deploy_tag }} over HTTPS within 60s."
        echo "Pi has no GitHub SSH key; origin must be HTTPS and the tag must exist on the remote."
        exit 1
      args:
        executable: /bin/bash

    - name: Checkout deploy tag on existing workspace
      when: workspace_git.stat.exists
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ workspace_dir }}"
        echo "Checking out {{ deploy_tag }}…"
        git checkout --force "{{ deploy_tag }}" \
          || git checkout --force "refs/tags/{{ deploy_tag }}" \
          || git checkout --force FETCH_HEAD
        echo "HEAD=$(git rev-parse --short HEAD) $(git log -1 --oneline)"
      args:
        executable: /bin/bash

    - name: Ensure config directory exists
      ansible.builtin.file:
        path: "{{ workspace_dir }}/config"
        state: directory
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0755"

    - name: Template config/device.yaml from robot_type / site_id
      ansible.builtin.template:
        src: templates/device.yaml.j2
        dest: "{{ workspace_dir }}/config/device.yaml"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"
        force: true

    - name: Ensure robot-prod.env exists from example
      ansible.builtin.copy:
        src: "{{ workspace_dir }}/robot-prod.env.example"
        dest: "{{ env_file }}"
        remote_src: true
        force: false
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"

    - name: Ensure per-device env is writable by deploy user
      ansible.builtin.file:
        path: "{{ env_file }}"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"

    - name: Seed Postgres password (agent will pin image refs on first reconcile)
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        ENV="{{ env_file }}"
        PG="{{ postgres_password }}"
        touch "$ENV"
        grep -q '^POSTGRES_PASSWORD=' "$ENV" || echo 'POSTGRES_PASSWORD=' >> "$ENV"
        sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${PG}|" "$ENV"
      args:
        executable: /bin/bash
      no_log: true

    - name: Docker Hub login for private image pulls (install user)
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        echo "{{ dockerhub_token }}" | docker login -u "{{ dockerhub_username }}" --password-stdin
      args:
        executable: /bin/bash
      no_log: true

    # --- fleet-agent install -------------------------------------------------
    - name: Ensure fleet-agent directory exists
      ansible.builtin.file:
        path: "{{ fleet_agent_dir }}"
        state: directory
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0755"

    - name: Copy fleet-agent sources from controller
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ fleet_agent_dir }}/"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0644"
      loop:
        - "{{ fleet_agent_src }}/agent.py"
        - "{{ fleet_agent_src }}/envfile.py"
        - "{{ fleet_agent_src }}/requirements.txt"

    - name: Create fleet-agent venv
      become: true
      become_user: "{{ install_user }}"
      ansible.builtin.command:
        cmd: python3 -m venv {{ fleet_agent_dir }}/venv
        creates: "{{ fleet_agent_dir }}/venv/bin/python"

    - name: Template fleet-agent.env
      ansible.builtin.template:
        src: templates/fleet-agent.env.j2
        dest: /opt/rhapsodi/fleet-agent.env
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: "0600"
        force: true
      no_log: true

    - name: Template systemd unit
      ansible.builtin.template:
        src: templates/rhapsodi-fleet-agent.service.j2
        dest: /etc/systemd/system/rhapsodi-fleet-agent.service
        mode: "0644"
        force: true

    - name: Reload systemd and enable fleet-agent
      ansible.builtin.systemd:
        name: rhapsodi-fleet-agent
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Provision summary
      ansible.builtin.debug:
        msg: >-
          Provisioned {{ inventory_hostname }} as robot_type={{ robot_type }}
          site_id={{ site_id }} image_tag={{ image_tag }}
          workspace={{ workspace_dir }}. fleet-agent installed; it will pull
          the desired release from {{ fleet_console_url }}.
