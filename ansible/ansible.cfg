[defaults]
inventory = inventory/tailscale.py
host_key_checking = False
interpreter_python = auto_silent
timeout = 30
forks = 10
# Use default callback; 'yaml' requires community.general on some installs.
stdout_callback = default
# Keep output readable without the yaml callback plugin.
bin_ansible_callbacks = True
# Create ansible/.vault_pass locally (gitignored). Placeholder vault password: changeme
vault_password_file = .vault_pass

[privilege_escalation]
become = False
