# Fleet runtime profiles — independent of image version (git SHA).
#
# A device picks:
#   - version: tracked_branch + pinned image_tag (code)
#   - profile: one of the keys below (runtime behavior / layout)
#
# Ansible apply (deploy.yml / provision.yml):
#   -e profile=<id>
# writes PROFILE_ID + env overrides into robot-prod.env and selects compose_file.
#
# Pose/scene overrides under config/profiles/<id>/ are shipped in the slim
# deploy bundle and mounted at /ws/config on the device.

profiles:
  prod-niryo:
    description: Production webhook weighment stack (Niryo)
    robot_type: niryo
    compose_file: docker-compose.robot-prod.yml
    env:
      PROFILE_ID: prod-niryo
      BT_TREE: /ws/install/share/robot_orchestrator/bt_trees/webhook_weightment.xml
      DATA_OUTPUT_ROOT: /data/webhook
      POSES_YAML: /root/.ros/scooping_controller/poses_real.yaml
      TARGETS_YAML: /ws/install/share/robot_moveit/targets.yaml
      CONTAINER_SCENE_YAML: /ws/install/share/scooping_controller/config/container_scene_real.yaml

  lightsout-training:
    description: Lights-out training BT + data collection (Niryo)
    robot_type: niryo
    # Same edge compose as prod; only BT tree + data root change.
    compose_file: docker-compose.robot-prod.yml
    env:
      PROFILE_ID: lightsout-training
      BT_TREE: /ws/install/share/robot_orchestrator/bt_trees/lightsout.xml
      DATA_OUTPUT_ROOT: /data/lightsout
      POSES_YAML: /root/.ros/scooping_controller/poses_real.yaml
      TARGETS_YAML: /ws/install/share/robot_moveit/targets.yaml
      CONTAINER_SCENE_YAML: /ws/install/share/scooping_controller/config/container_scene_real.yaml

  prod-jaka:
    description: Production webhook weighment stack (Jaka) — amd64 only today
    robot_type: jaka
    compose_file: docker-compose.robot-prod.yml
    env:
      PROFILE_ID: prod-jaka
      BT_TREE: /ws/install/share/robot_orchestrator/bt_trees/webhook_weightment.xml
      DATA_OUTPUT_ROOT: /data/webhook
      POSES_YAML: /root/.ros/scooping_controller/poses_real.yaml
      TARGETS_YAML: /ws/install/share/robot_moveit/targets_jaka.yaml
      CONTAINER_SCENE_YAML: /ws/install/share/scooping_controller/config/container_scene_real.yaml

  jaka-site2-layout:
    description: Jaka with site-2 table layout (custom scoop/pour poses)
    robot_type: jaka
    compose_file: docker-compose.robot-prod.yml
    env:
      PROFILE_ID: jaka-site2-layout
      BT_TREE: /ws/install/share/robot_orchestrator/bt_trees/webhook_weightment.xml
      DATA_OUTPUT_ROOT: /data/webhook
      # Host paths under the slim deploy bundle (mounted as /ws/config)
      POSES_YAML: /ws/config/profiles/jaka-site2/poses_real.yaml
      TARGETS_YAML: /ws/config/profiles/jaka-site2/targets_jaka.yaml
      CONTAINER_SCENE_YAML: /ws/config/profiles/jaka-site2/container_scene.yaml
