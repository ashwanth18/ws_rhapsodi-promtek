name: rhapsodi-promtek-prod

x-ros-prod-service: &ros-prod-service
  image: ${ROS_PROD_IMAGE:-iserenity/rhapsodi-promtek:ros-prod}
  network_mode: host
  ipc: host
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

services:
  runtime:
    <<: *ros-prod-service
    tty: true
    stdin_open: true
    command: bash

  dashboard:
    image: ${DASHBOARD_IMAGE:-iserenity/rhapsodi-promtek:dashboard}
    ports:
      - "${DASHBOARD_PORT:-8080}:80"

  rosbridge:
    <<: *ros-prod-service
    ports:
      - "9090:9090"
    command: ros2 launch niryo_robot_simulation_client rosbridge_websocket_fixed.launch.py address:=0.0.0.0 port:=9090

  realsense_launcher:
    <<: *ros-prod-service
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command: ros2 run realsense_snapshot_analyzer realsense_camera_launcher
    restart: unless-stopped

  scale_launcher:
    <<: *ros-prod-service
    privileged: true
    command: >
      ros2 run sensor_lifecycle scale_launcher
      --ros-args
      -p port:=${SCALE_PORT:-/dev/ttyUSB0}
      -p baud:=${SCALE_BAUD:-9600}
      -p topic:=${SCALE_TOPIC:-weight}
    restart: unless-stopped

  micro_ros_launcher:
    <<: *ros-prod-service
    privileged: true
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    command: >
      ros2 run sensor_lifecycle micro_ros_launcher
      --ros-args
      -p agent_args:="${MICRO_ROS_AGENT_ARGS:-serial --dev /dev/ttyACM0}"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: robot_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-iserenity/rhapsodi-promtek:backend}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/robot_data
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      WEIGHMENT_URL: http://host.docker.internal:5002/batch/weighment
      BATCH_END_URL: http://host.docker.internal:5002/batch/end
      TIMESERIES_URL: http://host.docker.internal:5002/timeseries
      TIMESERIES_ORGANISATION_ID: ${TIMESERIES_ORGANISATION_ID:-6647A41A-8FEB-4082-86F4-3D14964161AD}
      TIMESERIES_SITE_ID: ${TIMESERIES_SITE_ID:-76454DA2-683C-4706-A88E-4E2FC6773685}
      TIMESERIES_USER_ID: ${TIMESERIES_USER_ID:-15de0997-1508-4f2e-91de-14745f295d9e}
      PATH_MAP_FROM: ${WORKSPACE_ROOT:-/home/ashwanth/ws_rhapsodi-promtek-dev}/data
      PATH_MAP_TO: /data
      ROBOT_START_ADAPTER_URL: http://host.docker.internal:8010/start_webhook_weightment
      ROBOT_RUNNING_TIMEOUT_SECONDS: ${ROBOT_RUNNING_TIMEOUT_SECONDS:-300}
      ROSBRIDGE_HOST: host.docker.internal
      ROSBRIDGE_PORT: 9090
      ROBOT_LOCATION_TARGETS_JSON: ${ROBOT_LOCATION_TARGETS_JSON:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  robot_start_adapter:
    <<: *ros-prod-service
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      ROBOT_START_SERVICE_NAME: /bt_start_webhook_weightment
      ROBOT_START_SERVICE_WAIT_TIMEOUT_SECONDS: 5
      ROBOT_START_SERVICE_CALL_TIMEOUT_SECONDS: 15
    command:
      [
        "bash",
        "-lc",
        "cd /ws/src/backend/robot_adapter && uvicorn main:app --host 0.0.0.0 --port 8010",
      ]
    restart: unless-stopped

  processing:
    image: ${PROCESSING_IMAGE:-iserenity/rhapsodi-promtek:processing}
    environment:
      BACKEND_URL: http://backend:8000
      PATH_MAP_FROM: ${WORKSPACE_ROOT:-/home/ashwanth/ws_rhapsodi-promtek-dev}/data
      PATH_MAP_TO: /data
    volumes:
      - ./data:/data
    depends_on:
      - db
    ports:
      - "8002:8002"

  webhook_service:
    image: ${WEBHOOK_IMAGE:-iserenity/rhapsodi-promtek:webhook}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/robot_data
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    depends_on:
      - db

volumes:
  db_data:
