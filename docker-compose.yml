name: rhapsodi-promtek

x-ros-local-service: &ros-local-service
  image: ${ROS_LOCAL_IMAGE:-rhapsodi-promtek:ros-prod-local}
  build:
    context: .
    dockerfile: docker/ros/Dockerfile.prod
    args:
      COLCON_PARALLEL_WORKERS: ${COLCON_PARALLEL_WORKERS:-8}
  network_mode: host
  ipc: host
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

services:
  # Prebuilt runtime container (uses the baked-in /ws/install overlay)
  runtime:
    <<: *ros-local-service
    tty: true
    stdin_open: true
    command: bash

  # Dev container (mounts the repo so you can edit locally and rebuild inside the container)
  dev:
    image: ${ROS_DEV_IMAGE:-rhapsodi-promtek:ros-dev-local}
    build:
      context: .
      dockerfile: docker/ros/Dockerfile.dev
      target: devshell
      args:
        COLCON_PARALLEL_WORKERS: ${COLCON_PARALLEL_WORKERS:-8}
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - .:/workspace:rw
    tty: true
    stdin_open: true
    command: bash

  # React dashboard (static build served via nginx)
  dashboard:
    image: ${DASHBOARD_LOCAL_IMAGE:-rhapsodi-promtek:dashboard-local}
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args:
        VITE_ROSBRIDGE_URL: ${VITE_ROSBRIDGE_URL:-ws://localhost:9090}
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
        VITE_MICROROS_HEARTBEAT_TOPIC: ${VITE_MICROROS_HEARTBEAT_TOPIC:-/microros/heartbeat}
    ports:
      - "${DASHBOARD_PORT:-8080}:80"

  # Rosbridge websocket (exposed to host)
  rosbridge:
    <<: *ros-local-service
    ports:
      - "9090:9090"
    command: ros2 launch niryo_robot_simulation_client rosbridge_websocket_fixed.launch.py address:=0.0.0.0 port:=9090

  # RealSense lifecycle launcher
  realsense_launcher:
    <<: *ros-local-service
    ipc: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command: ros2 run realsense_snapshot_analyzer realsense_camera_launcher
    restart: unless-stopped

  # Weighing scale lifecycle launcher
  scale_launcher:
    <<: *ros-local-service
    privileged: true
    command: >
      ros2 run sensor_lifecycle scale_launcher
      --ros-args
      -p port:=${SCALE_PORT:-/dev/ttyUSB0}
      -p baud:=${SCALE_BAUD:-9600}
      -p topic:=${SCALE_TOPIC:-weight}
    restart: unless-stopped

  # micro-ROS lifecycle launcher
  micro_ros_launcher:
    <<: *ros-local-service
    privileged: true
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    command: >
      ros2 run sensor_lifecycle micro_ros_launcher
      --ros-args
      -p agent_args:="${MICRO_ROS_AGENT_ARGS:-serial --dev /dev/ttyACM0}"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: robot_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_LOCAL_IMAGE:-rhapsodi-promtek:backend-local}
    build:
      context: ./src/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/robot_data
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      WEIGHMENT_URL: http://host.docker.internal:5002/batch/weighment
      BATCH_END_URL: http://host.docker.internal:5002/batch/end
      TIMESERIES_URL: http://host.docker.internal:5002/timeseries
      PATH_MAP_FROM: ${WORKSPACE_ROOT:-/home/ashwanth/ws_rhapsodi-promtek-dev}/data
      PATH_MAP_TO: /data
      ROBOT_START_ADAPTER_URL: http://host.docker.internal:8010/start_webhook_weightment
      ROBOT_RUNNING_TIMEOUT_SECONDS: ${ROBOT_RUNNING_TIMEOUT_SECONDS:-300}
      ROSBRIDGE_HOST: host.docker.internal
      ROSBRIDGE_PORT: 9090
      ROBOT_LOCATION_TARGETS_JSON: ${ROBOT_LOCATION_TARGETS_JSON:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  robot_start_adapter:
    <<: *ros-local-service
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      ROBOT_START_SERVICE_NAME: /bt_start_webhook_weightment
      ROBOT_START_SERVICE_WAIT_TIMEOUT_SECONDS: 5
      ROBOT_START_SERVICE_CALL_TIMEOUT_SECONDS: 15
    command:
      [
        "bash",
        "-lc",
        "cd /ws/src/backend/robot_adapter && uvicorn main:app --host 0.0.0.0 --port 8010",
      ]
    restart: unless-stopped

  processing:
    image: ${PROCESSING_LOCAL_IMAGE:-rhapsodi-promtek:processing-local}
    build:
      context: ./src/backend/processing
    environment:
      BACKEND_URL: http://backend:8000
      PATH_MAP_FROM: ${WORKSPACE_ROOT:-/home/ashwanth/ws_rhapsodi-promtek-dev}/data
      PATH_MAP_TO: /data
    volumes:
      - ./data:/data
    depends_on:
      - db
    ports:
      - "8002:8002"

  webhook_service:
    image: ${WEBHOOK_LOCAL_IMAGE:-rhapsodi-promtek:webhook-local}
    build:
      context: ./src/backend/webhook_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/robot_data
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    depends_on:
      - db

volumes:
  db_data:


